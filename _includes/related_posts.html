<div class="post-grid">
  {% for post in site.pages %}
    {% if post.project == include.project %}
      <a href="{{ post.url }}" class="post-card">
        {% if post.image %}
          <img src="../{{ post.image }}" alt="Missing image">
        {% endif %}
        <h3>{{ post.title }}</h3>
      </a>
    {% endif %}
  {% endfor %}
</div>
