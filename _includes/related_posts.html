<div class="post-grid-related">
  {% assign items = site.pages | sort: "priority" %}
  {% for post in items %}
    {% if post.project == include.project %}
      <a href="{{ post.url }}" class="post-card-related">
        {% if post.image %}
          <img src="../{{ post.image }}" alt="Missing image">
        {% endif %}
        <h3>{{ post.title }}</h3>
        <div class="tags">
          {% for tag in item.tags %}
            <span class="tag" style="background-color: {{ site.post_tags[tag] }}">{{ tag }}</span>
          {% endfor %}
        </div>
      </a>
    {% endif %}
  {% endfor %}
</div>
