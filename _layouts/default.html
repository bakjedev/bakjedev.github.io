<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <title>{{ site.title }}</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/syntax.css">
</head>
<body>
  <header class="top-bar">
    <div class="stuff-left">
      <a href="mailto:contact@bakje.dev">E-mail</a>
      <a href="/assets/Resume-Quinten-Bubberman.pdf" target="_blank">Resume</a>
    </div>
    <nav>
      <a href="/">Home</a>
      <a href="/projects">Projects</a>
      <a href="/pages">Posts</a>
    </nav>
    <div class="stuff-right">
      <a href="https://github.com/bakjedev">Github</a>
      <a href="https://www.linkedin.com/in/quinten-bubberman/">LinkedIn</a>
    </div>
    <button class="burger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="mobile-overlay">
    <div class="overlay-top">
      <a href="mailto:contact@bakje.dev">E-mail</a>
      <button class="overlay-close" aria-label="Close menu">
        <span></span><span></span>
      </button>
    </div>
    <a href="/assets/Resume-Quinten-Bubberman.pdf" target="_blank">Resume</a>
    <a href="https://github.com/bakjedev">Github</a>
    <a href="https://www.linkedin.com/in/quinten-bubberman/">LinkedIn</a>
  </div>

  {% if page.title %}
    <h1 id="{{ page.title }}">{{ page.title }}</h1>
  {% endif %}

  {% if page.datePosted %}
    <p>{{ page.datePosted }}</p>
  {% endif %}

  {% unless page.noBack %}
    <a href="/" onclick="if(document.referrer.includes('bakje.dev')){history.back()}else{window.location='/'};return false;" class="back-button">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#444"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
  {% endunless %}
    
  {{ content }}

  <script>
    document.querySelectorAll('a').forEach(link => {
      if (link.hostname !== window.location.hostname) {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener');
      }
    });
  </script>
  <script>
    const burger = document.querySelector('.burger');
    const overlay = document.querySelector('.mobile-overlay');
    const closeBtn = document.querySelector('.overlay-close');

    burger.addEventListener('click', () => {
      overlay.classList.add('open');
      burger.setAttribute('aria-expanded', true);
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('open');
      burger.setAttribute('aria-expanded', false);
    });

    document.addEventListener('click', e => {
      if (!overlay.contains(e.target) && !burger.contains(e.target)) {
        overlay.classList.remove('open');
        burger.setAttribute('aria-expanded', false);
      }
    });

    window.addEventListener('scroll', () => {
      overlay.classList.remove('open');
      burger.setAttribute('aria-expanded', false);
    });

    let lastScroll = 0;
    const topBar = document.querySelector('.top-bar');

    window.addEventListener('scroll', () => {
      const current = window.scrollY;
      if (window.innerWidth <= 600) {
        if (lastScroll - current > 10 || current <= 0) {
          topBar.style.transform = 'translateY(0)';
        } else if (current > lastScroll + 10) {
          topBar.style.transform = 'translateY(-100%)';
        }
      }
      lastScroll = current;
    });
  </script>
</body>
</html>
